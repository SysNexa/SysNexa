<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101124">
  <title>Loading page…</title>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      color: #f7f7ff;
      background: #101124;
      font: 16px/1.6 system-ui, sans-serif;
    }
    main { max-width: 560px; text-align: center; }
    p { color: #a7a9c2; }
  </style>
</head>
<body>
  <main id="status" role="status" aria-live="polite">
    <h1>Loading page…</h1>
    <p>Please wait while we connect to the website.</p>
  </main>
  <script>
    // Configure the host to route /load.html/* requests to this file.
    (async function loadPage() {
      const loaderUrl = new URL("./index.html", window.location.href);
      const siteRoot = new URL("./", loaderUrl);
      const loaderPath = loaderUrl.pathname.replace(/\/+$/, "");
      const currentPath = window.location.pathname;
      const route = currentPath.startsWith(loaderPath + "/")
        ? currentPath.slice(loaderPath.length + 1)
        : "";

      let filePath = route || "main.html";
      try {
        filePath = decodeURIComponent(filePath);
      } catch {
        showError("The page path contains invalid encoding.");
        return;
      }

      const segments = filePath.split("/");
      if (segments.some((segment) =>
        !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(segment) || segment === ".."
      )) {
        showError("That page path is not valid.");
        return;
      }

      if (!/\.html?$/i.test(filePath)) filePath += ".html";

      const pageUrl = new URL(
        segments.map(encodeURIComponent).join("/"),
        siteRoot
      );

      try {
        const response = await fetch(pageUrl, { credentials: "same-origin" });
        if (!response.ok) {
          throw new Error(`The server returned ${response.status} ${response.statusText}.`);
        }
        if (!response.headers.get("content-type")?.toLowerCase().includes("text/html")) {
          throw new Error("The requested file is not served as an HTML page.");
        }

        const html = await response.text();
        const loadedDocument = new DOMParser().parseFromString(html, "text/html");
        const base = loadedDocument.createElement("base");
        base.href = new URL(".", pageUrl).href;
        loadedDocument.head.prepend(base);

        document.open();
        document.write("<!DOCTYPE html>\n" + loadedDocument.documentElement.outerHTML);
        document.close();
      } catch (error) {
        showError(`We couldn't load ${filePath}. ${error.message}`);
      }

      function showError(message) {
        const status = document.getElementById("status");
        status.innerHTML = "<h1>Page unavailable</h1><p></p>";
        status.querySelector("p").textContent = message;
        document.title = "Page unavailable";
      }
    })();
  </script>
</body>
</html>
